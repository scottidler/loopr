otto:
  api: 1
  tasks: [ci]
  envs:
    VERSION: "$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"

tasks:
  lint:
    help: "Run whitespace linting"
    bash: |
      whitespace -r

  check:
    help: "Run all quality checks (compile, clippy, format)"
    bash: |
      echo "=== Checking compilation ==="
      cargo check --all-targets --all-features
      echo ""
      echo "=== Running Clippy ==="
      cargo clippy --all-targets --all-features -- -D warnings
      echo ""
      echo "=== Checking format ==="
      cargo fmt
      cargo fmt --all --check
      echo ""
      echo "All checks passed!"

  ensure:
    help: "Fail if no tests exist"
    bash: |
      set -e
      set -o pipefail
      test_output=$(cargo test --all-targets --workspace -- --list --format=terse 2>&1) || {
          echo "$test_output"
          echo ""
          echo "Build or test discovery failed!"
          exit 1
      }
      if ! echo "$test_output" | awk 'END { exit(found ? 0 : 1) } /: test$/ { found=1 }'; then
          echo "$test_output"
          echo ""
          echo "No tests found! Tests must be wired into the crate."
          exit 1
      fi
      test_count=$(echo "$test_output" | grep -c ": test$" || echo "0")
      echo "Found $test_count tests"

  test:
    help: "Run all tests"
    before: [ensure]
    bash: |
      cargo test --all-features

  ci:
    help: "Full CI pipeline (lint + check + test)"
    before: [lint, check, test]
    bash: |
      echo "All CI checks passed!"

  build:
    help: "Build release binary"
    bash:
      cargo build --release
      echo "Release build complete"

  clean:
    help: "Clean build artifacts"
    bash: |
      cargo clean
      echo "Build artifacts cleaned"
