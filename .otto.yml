otto:
  api: 1
  tasks: [ci]
  envs:
    VERSION: "$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"

tasks:
  lint:
    help: "Run whitespace linting across the workspace"
    bash: |
      whitespace -r

  # Fail if any source file exceeds BLOAT_MAX_LINES (default 1500)
  bloat:
    help: "Fail if any source file exceeds BLOAT_MAX_LINES (default 1500)"
    bash: |
      LIMIT="${BLOAT_MAX_LINES:-1500}"
      FAILED=0
      echo "=== Checking file line counts (limit: $LIMIT) ==="
      while IFS= read -r file; do
        lines=$(wc -l < "$file")
        if [ "$lines" -gt "$LIMIT" ]; then
          delta=$((lines - LIMIT))
          echo "  FAIL: $file ($lines lines, +$delta over limit)"
          FAILED=1
        fi
      done < <(find . -type f \( -name "*.rs" -o -name "*.py" -o -name "*.js" -o -name "*.ts" \) \
        -not -path "*/target/*" \
        -not -path "*/node_modules/*" \
        -not -path "*/.venv/*" \
        -not -path "*/__pycache__/*" \
        -not -path "*/dist/*" \
        -not -path "*/build/*" \
        -not -path "*/.git/*")
      if [ "$FAILED" -eq 1 ]; then
        echo ""
        echo "Decompose these files into modules before proceeding."
        exit 1
      fi
      echo "All files within $LIMIT line limit"

  check:
    help: "Compile, clippy, and format across the workspace"
    bash: |
      echo "=== Checking compilation ==="
      cargo check --workspace --all-targets
      echo ""
      echo "=== Running Clippy ==="
      cargo clippy --workspace --all-targets -- -D warnings
      echo ""
      echo "=== Checking format ==="
      cargo fmt --all -- --check

  test:
    help: "Run all tests across the workspace"
    bash: |
      cargo test --workspace

  ci:
    help: "Full workspace CI (lint + bloat + check + test)"
    before: [lint, bloat, check, test]
    bash: |
      echo "Workspace CI passed"

  build:
    help: "Build release binary"
    bash: |
      cargo build --release
      echo "Release build complete"

  clean:
    help: "Clean build artifacts"
    bash: |
      cargo clean

  install:
    help: "Install the loopr binary locally via cargo"
    bash: |
      cargo install --path crates/loopr
      echo "loopr installed to ~/.cargo/bin"
