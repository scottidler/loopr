name: hierarchy
description: Shared lifecycle for Plan, Spec, and Phase records

states:
  - draft
  - pending
  - active
  - complete
  - superseded
  - abandoned

terminal:
  - complete
  - superseded
  - abandoned

transitions:
  draft:
    pending: { by: [coordinator] }
    active: { by: [coordinator] }
    superseded: { by: [coordinator, director] }
    abandoned: { by: [coordinator, director] }
  pending:
    active: { by: [coordinator] }
    superseded: { by: [coordinator, director] }
    abandoned: { by: [coordinator, director] }
  active:
    complete: { by: [coordinator, decomposer] }
    superseded: { by: [coordinator, director] }
    abandoned: { by: [coordinator, director] }

overrides:
  active:
    draft: { by: [director] }
  pending:
    draft: { by: [director] }

guards: {}
