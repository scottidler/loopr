# Upward feedback strategy: revise parent when children all fail.

# When all works under a spec are abandoned, revise the parent spec
# by transitioning it back to Draft for re-decomposition.
# This is the upward feedback loop the coordinator handled via ReviseParent.
revise-parent-on-impossible-spec:
  description: Revise parent spec when all child works are abandoned
  trigger: spec-children-all-abandoned
  scope: spec
  priority: 870
  action:
    - primitive: transition-record
      params:
        collection: spec
        id: $trigger.scope-id
        target-status: draft
        role: coordinator
        reason: children-all-abandoned-bubble-up
