# Supervision strategies: restart Director on failure.
# Dual pattern: event-driven (fast) + level-triggered (reliable, principle 8).

# Fast reaction: restart Director immediately when a failure event arrives.
restart-director-on-event:
  description: Restart Director after a failure event, up to max restarts
  trigger: director-failed
  scope: session
  priority: 1200
  action:
    - name: restart-check
      primitive: check-threshold
      params:
        collection: session
        id: director
        field: restart-count
        max: 5
  on-success:
    - primitive: spawn-agent
      params:
        role: director
  on-failure:
    - primitive: escalate
      params:
        reason: director-max-restarts-exceeded

# Level-triggered fallback: catches missed events after restart or on cold start.
restart-director-on-state:
  description: Restart Director if no active Director session exists (level-triggered fallback)
  trigger: no-running-director
  scope: plan
  priority: 1100
  cooldown-secs: 60
  action:
    - name: restart-check
      primitive: check-threshold
      params:
        collection: session
        id: director
        field: restart-count
        max: 5
  on-success:
    - primitive: spawn-agent
      params:
        role: director
  on-failure:
    - primitive: escalate
      params:
        reason: director-max-restarts-exceeded
