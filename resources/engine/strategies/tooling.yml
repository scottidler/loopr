# Tooling strategies: validation tool registration.

# When a phase becomes Active, register its validation commands as tools.
register-tools-on-phase-active:
  description: Register validation tools when a phase becomes Active
  trigger: phase-is-active
  scope: phase
  priority: 890
  action:
    - primitive: register-validation-tools
      params:
        phase-id: $trigger.scope-id

# NOTE: spawn-researcher-for-missing-tools removed - requires a state query
# that can check runtime tool registration state, which doesn't exist yet.
# The researcher spawning for missing tools will be added when the query
# infrastructure supports it (future work).
