# Integration strategies: replace v3's integrator cycle.

# Integrate all accepted bundles for a plan in one atomic tick operation.
# Merges branches, creates a Tick in Open state, emits tick.created event.
# Does NOT run validation (that would block the engine loop).
integrate-accepted-bundles:
  description: Integrate accepted bundles for a plan using the atomic integrate-tick primitive
  trigger: bundles-ready-for-integration
  scope: plan
  priority: 500
  action:
    - primitive: integrate-tick
      params:
        plan-id: $trigger.scope-id

# When a tick is created after integration, validate and publish it.
# This runs via IPC handler (integrator.publish) which executes validation
# shell commands. Runs as an event-driven strategy so it doesn't block
# the engine's convergence loop.
validate-and-publish-tick:
  description: Validate and publish a newly created tick
  trigger: tick-created
  scope: tick
  priority: 490
  action:
    - primitive: validate-and-publish-tick
      params:
        tick-id: $trigger.event.tick-id
        merged-work-ids: $trigger.event.merged-work-ids
