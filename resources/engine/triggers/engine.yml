# Triggers required by the composition engine default strategies.

# Fires when a tick is published - used to drive sweep strategies
tick-published:
  type: event
  event: tick.published
  scope: plan

# Fires when a plan has at least one Bundle in Accepted status attached to any
# Work descended from the plan (brief-mode direct children or full-mode via
# Spec -> Phase -> Work). Drives the integrate-accepted-bundles strategy.
bundles-ready-for-integration:
  type: state-query
  scope: plan
  query: has-accepted-bundles

# Fires when a tick is created after integration - triggers async validation.
tick-created:
  type: event
  event: tick.created
  scope: tick

# Fires for plans with no Running or Paused Director sessions (level-triggered fallback)
no-running-director:
  type: state-query
  scope: plan
  query: no-active-sessions
