otto:
  api: 1
  tasks: [ci]

tasks:
  lint:
    help: "Whitespace lint"
    bash: |
      whitespace -r

  check:
    help: "Compile, clippy, format for this crate"
    bash: |
      cargo check -p agents --all-targets
      cargo clippy -p agents --all-targets -- -D warnings
      cargo fmt -p agents -- --check

  test:
    help: "Run tests for this crate"
    bash: |
      cargo test -p agents

  ci:
    help: "Scoped CI (lint + check + test) for agents"
    before: [lint, check, test]
    bash: |
      echo "agents CI passed"
