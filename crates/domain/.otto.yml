otto:
  api: 1
  tasks: [ci]

tasks:
  lint:
    help: "Whitespace lint"
    bash: |
      whitespace -r

  check:
    help: "Compile, clippy, format for this crate"
    bash: |
      cargo check -p domain --all-targets
      cargo clippy -p domain --all-targets -- -D warnings
      cargo fmt -p domain -- --check

  test:
    help: "Run tests for this crate"
    bash: |
      cargo test -p domain

  ci:
    help: "Scoped CI (lint + check + test) for domain"
    before: [lint, check, test]
    bash: |
      echo "domain CI passed"
