otto:
  api: 1
  tasks: [ci]

tasks:
  lint:
    help: "Whitespace lint"
    bash: |
      whitespace -r

  check:
    help: "Compile, clippy, format for this crate"
    bash: |
      cargo check -p context --all-targets
      cargo clippy -p context --all-targets -- -D warnings
      cargo fmt -p context -- --check

  test:
    help: "Run tests for this crate"
    bash: |
      cargo test -p context

  ci:
    help: "Scoped CI (lint + check + test) for context"
    before: [lint, check, test]
    bash: |
      echo "context CI passed"
