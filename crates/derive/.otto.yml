otto:
  api: 1
  tasks: [ci]

tasks:
  lint:
    help: "Whitespace lint"
    bash: |
      whitespace -r

  check:
    help: "Compile, clippy, format for this crate"
    bash: |
      cargo check -p derive --all-targets
      cargo clippy -p derive --all-targets -- -D warnings
      cargo fmt -p derive -- --check

  test:
    help: "Run tests for this crate"
    bash: |
      cargo test -p derive

  ci:
    help: "Scoped CI (lint + check + test) for derive"
    before: [lint, check, test]
    bash: |
      echo "derive CI passed"
