otto:
  api: 1
  tasks: [ci]

tasks:
  lint:
    help: "Whitespace lint"
    bash: |
      whitespace -r

  filesize:
    help: "Fail if any .rs file exceeds FILESIZE_MAX_LINES (default 1500)"
    bash: |
      THRESHOLD="${FILESIZE_MAX_LINES:-1500}"
      FAILED=0
      while IFS= read -r file; do
        lines=$(wc -l < "$file")
        if [ "$lines" -gt "$THRESHOLD" ]; then
          echo "  $lines lines: $file"
          FAILED=1
        fi
      done < <(find src -type f -name '*.rs' 2>/dev/null)
      if [ "$FAILED" -eq 1 ]; then
        echo ""
        echo "❌ Files above ${THRESHOLD}-line limit. Decompose into a module directory."
        exit 1
      fi
      echo "✅ All .rs files under $THRESHOLD lines"

  check:
    help: "Compile, clippy, format for this crate"
    bash: |
      cargo check -p loopr --all-targets
      cargo clippy -p loopr --all-targets -- -D warnings
      cargo fmt -p loopr -- --check

  test:
    help: "Run tests for this crate"
    bash: |
      cargo test -p loopr

  ci:
    help: "Scoped CI (lint + check + test) for loopr"
    before: [lint, filesize, check, test]
    bash: |
      echo "loopr CI passed"

  install:
    help: "Install the loopr binary locally"
    bash: |
      cargo install --path .
      echo "loopr installed to ~/.cargo/bin"
