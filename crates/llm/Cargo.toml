[package]
name = "llm"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Test-only scripted `LlmClient` stub. Consumed by `agents`, `decomposer`,
# and `loopr`'s integration tests; never enabled in production `[dependencies]`.
stub = []

[dependencies]
domain = { path = "../domain" }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
telemetry = { path = "../telemetry" }
thiserror = "2.0.18"
tracing.workspace = true
trait-variant.workspace = true
url = "2.5.8"

[dev-dependencies]
serde_yaml.workspace = true
tokio = { version = "1.52.1", features = ["macros", "rt"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
wiremock = "0.6.5"
