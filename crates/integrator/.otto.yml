otto:
  api: 1
  tasks: [ci]

tasks:
  lint:
    help: "Whitespace lint"
    bash: |
      whitespace -r

  # Fail if any source file exceeds BLOAT_MAX_LINES (default 1500)
  bloat:
    help: "Fail if any source file exceeds BLOAT_MAX_LINES (default 1500)"
    bash: |
      LIMIT="${BLOAT_MAX_LINES:-1500}"
      FAILED=0
      echo "=== Checking file line counts (limit: $LIMIT) ==="
      while IFS= read -r file; do
        lines=$(wc -l < "$file")
        if [ "$lines" -gt "$LIMIT" ]; then
          delta=$((lines - LIMIT))
          echo "  FAIL: $file ($lines lines, +$delta over limit)"
          FAILED=1
        fi
      done < <(find . -type f \( -name "*.rs" -o -name "*.py" -o -name "*.js" -o -name "*.ts" \) \
        -not -path "*/target/*" \
        -not -path "*/node_modules/*" \
        -not -path "*/.venv/*" \
        -not -path "*/__pycache__/*" \
        -not -path "*/dist/*" \
        -not -path "*/build/*" \
        -not -path "*/.git/*")
      if [ "$FAILED" -eq 1 ]; then
        echo ""
        echo "Decompose these files into modules before proceeding."
        exit 1
      fi
      echo "All files within $LIMIT line limit"

  check:
    help: "Compile, clippy, format for this crate"
    bash: |
      cargo check -p integrator --all-targets
      cargo clippy -p integrator --all-targets -- -D warnings
      cargo fmt -p integrator -- --check

  test:
    help: "Run tests for this crate"
    bash: |
      cargo test -p integrator

  ci:
    help: "Scoped CI (lint + check + test) for integrator"
    before: [lint, bloat, check, test]
    bash: |
      echo "integrator CI passed"
