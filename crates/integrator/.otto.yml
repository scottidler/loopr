otto:
  api: 1
  tasks: [ci]

tasks:
  lint:
    help: "Whitespace lint"
    bash: |
      whitespace -r

  check:
    help: "Compile, clippy, format for this crate"
    bash: |
      cargo check -p integrator --all-targets
      cargo clippy -p integrator --all-targets -- -D warnings
      cargo fmt -p integrator -- --check

  test:
    help: "Run tests for this crate"
    bash: |
      cargo test -p integrator

  ci:
    help: "Scoped CI (lint + check + test) for integrator"
    before: [lint, check, test]
    bash: |
      echo "integrator CI passed"
