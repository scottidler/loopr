otto:
  api: 1
  tasks: [ci]

tasks:
  lint:
    help: "Whitespace lint"
    bash: |
      whitespace -r

  check:
    help: "Compile, clippy, format for this crate"
    bash: |
      cargo check -p worktree --all-targets
      cargo clippy -p worktree --all-targets -- -D warnings
      cargo fmt -p worktree -- --check

  test:
    help: "Run tests for this crate"
    bash: |
      cargo test -p worktree

  ci:
    help: "Scoped CI (lint + check + test) for worktree"
    before: [lint, check, test]
    bash: |
      echo "worktree CI passed"
