otto:
  api: 1
  tasks: [ci]

tasks:
  lint:
    help: "Whitespace lint"
    bash: |
      whitespace -r

  check:
    help: "Compile, clippy, format for this crate"
    bash: |
      cargo check -p ipc --all-targets
      cargo clippy -p ipc --all-targets -- -D warnings
      cargo fmt -p ipc -- --check

  test:
    help: "Run tests for this crate"
    bash: |
      cargo test -p ipc

  ci:
    help: "Scoped CI (lint + check + test) for ipc"
    before: [lint, check, test]
    bash: |
      echo "ipc CI passed"
