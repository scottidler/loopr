# Supervision strategies: replace v3's supervisor restart logic.
# Dual pattern: event-driven (fast) + level-triggered (reliable, principle 8).

# Fast reaction: restart coordinator immediately when a failure event arrives.
restart-coordinator-on-event:
  description: Restart coordinator after a failure event, up to max restarts
  trigger: coordinator-failed
  scope: session
  priority: 1200
  action:
    - name: restart-check
      primitive: check-threshold
      params:
        collection: session
        id: coordinator
        field: restart-count
        max: 5
  on-success:
    - primitive: spawn-agent
      params:
        role: coordinator
  on-failure:
    - primitive: escalate
      params:
        reason: coordinator-max-restarts-exceeded

# Level-triggered fallback: catches missed events after restart or on cold start.
restart-coordinator-on-state:
  description: Restart coordinator if no active coordinator session exists (level-triggered fallback)
  trigger: no-running-coordinator
  scope: plan
  priority: 1100
  cooldown-secs: 60
  action:
    - name: restart-check
      primitive: check-threshold
      params:
        collection: session
        id: coordinator
        field: restart-count
        max: 5
  on-success:
    - primitive: spawn-agent
      params:
        role: coordinator
  on-failure:
    - primitive: escalate
      params:
        reason: coordinator-max-restarts-exceeded
