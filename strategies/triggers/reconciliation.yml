# State-query triggers for reconciliation and lifecycle promotion.

phase-children-terminal:
  type: state-query
  scope: phase
  query: all-children-terminal
  params:
    child-collection: work
    terminal-statuses:
      - done
      - abandoned

spec-children-terminal:
  type: state-query
  scope: spec
  query: all-children-terminal
  params:
    child-collection: phase
    terminal-statuses:
      - complete
      - abandoned

hierarchy-deps-terminal:
  type: state-query
  scope: plan
  query: all-deps-terminal
  params:
    dep-field: dependencies
    terminal-statuses:
      - complete
      - abandoned

work-deps-done:
  type: state-query
  scope: work
  query: all-deps-done
  params:
    dep-field: dependencies

parent-active:
  type: state-query
  scope: work
  query: parent-active

plan-approved:
  type: state-query
  scope: plan
  query: field-is-true
  params:
    field: plan-approved

hierarchy-exists:
  type: state-query
  scope: plan
  query: has-children
  params:
    child-collection: spec

goal-complete:
  type: state-query
  scope: plan
  query: field-is-true
  params:
    field: goal-complete

coverage-incomplete:
  type: state-query
  scope: plan
  query: field-equals
  params:
    field: coverage-verdict
    value: incomplete

# ─── Phase-scoped promotion triggers ─────────────────────────────────────────
# These are scope: phase counterparts used in composite phase-promotable trigger.

phase-parent-active:
  type: state-query
  scope: phase
  query: parent-active

phase-deps-terminal:
  type: state-query
  scope: phase
  query: all-deps-terminal
  params:
    dep-field: dependencies
    terminal-statuses:
      - complete
      - abandoned

# ─── Decomposition triggers ───────────────────────────────────────────────────
# Self-active checks: each scope checks its own status field.
# Plans have no parent and cannot use parent-active; they must check themselves.

plan-is-active:
  type: state-query
  scope: plan
  query: field-equals
  params:
    field: status
    value: Active

spec-is-active:
  type: state-query
  scope: spec
  query: field-equals
  params:
    field: status
    value: Active

phase-is-active:
  type: state-query
  scope: phase
  query: field-equals
  params:
    field: status
    value: Active

# No-children checks: fire when a record has no children at the expected next level.

plan-active-no-specs:
  type: state-query
  scope: plan
  query: has-no-children
  params:
    child-collection: spec

spec-active-no-phases:
  type: state-query
  scope: spec
  query: has-no-children
  params:
    child-collection: phase

phase-active-no-works:
  type: state-query
  scope: phase
  query: has-no-children
  params:
    child-collection: work
