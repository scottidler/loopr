goal: "Build a Lua command-line todo application. Entry point is cli.lua, core logic in todo.lua, tests in test_todo.lua. json.lua and test.lua are pre-provided in the repo."
plan:
  title: "Lua Todo App"
  description: "Build a Lua CLI todo app with CRUD operations, JSON persistence, and tests."
  spec:
    title: "Todo App Implementation"
    description: "Core todo module with CLI and tests"
    phases:
      - title: "Core model"
        description: "TodoStore using pre-provided json.lua"
        validation-commands:
          - "lua -e \"dofile('todo.lua')\""
        works:
          - key: "todo-model"
            title: "Create todo.lua with TodoStore"
            description: |
              Create todo.lua that exports a TodoStore module.

              Use `local json = require("json")` for JSON — json.lua is pre-provided. Do NOT write your own JSON code.

              TodoStore API:
              - TodoStore.new(filepath): create a store instance, filepath defaults to "todos.json"
                - Load existing data from file on creation (use store:load())
              - store:add(title): create {id=<counter>, title=title, done=false}, append, save, return the todo
                - id is a unique incrementing integer counter (NOT os.time())
              - store:list(filter): return todos filtered by "all" (default), "active", or "done"
              - store:done(id): find todo by numeric id, set done=true, save, return true if found
              - store:delete(id): find todo by numeric id, remove from list, save, return true if found
              - store:load(): read file, decode JSON, populate self.todos; return empty list if file missing
              - store:save(): encode self.todos to JSON, write to file

              Module pattern (exact):
              - Define `local TodoStore = {}`
              - TodoStore.new returns a table instance with methods
              - Last line: `return TodoStore`
              - require("todo") returns a table where .new(filepath) is a function

              Use io.open for file I/O, json.encode/json.decode for persistence.
            resource_tags: ["todo.lua"]
            acceptance_criteria:
              - "require('todo') returns a table with .new()"
              - "store:add() creates a todo with unique integer id, title, done=false"
              - "store:list() returns todos filtered by status"
              - "store:done() marks the correct todo done, returns true"
              - "store:delete() removes the correct todo, returns true"
              - "JSON persistence survives new store on same file"
              - "lua -e \"dofile('todo.lua')\" exits without error"
      - title: "CLI and test suite"
        description: "Command-line interface and test coverage"
        validation-commands:
          - "lua test_todo.lua"
        works:
          - key: "cli-entry"
            title: "Create cli.lua with command-line interface"
            description: |
              Create cli.lua as the entry point.

              - `local TodoStore = require("todo")` to get the module
              - Create store: `local store = TodoStore.new()`
              - Parse arg[1] as command, arg[2] as argument
              - Commands:
                - add <title>: store:add(arg[2]), print "Added: [id] title"
                - list [filter]: store:list(arg[2] or "all"), print "  [x] id: title" (done) or "  [ ] id: title" (active)
                - done <id>: store:done(tonumber(arg[2])), print "Done: id" or "Not found: id"
                - delete <id>: store:delete(tonumber(arg[2])), print "Deleted: id" or "Not found: id"
                - no args / unknown: print usage
            resource_tags: ["cli.lua"]
            dependencies: ["todo-model"]
            acceptance_criteria:
              - "lua cli.lua add 'test' creates a todo and prints confirmation"
              - "lua cli.lua list shows todos with status indicators"
              - "lua cli.lua done <id> marks a todo as done"
              - "lua cli.lua delete <id> removes a todo"
          - key: "test-suite"
            title: "Create test_todo.lua with tests"
            description: |
              Create test_todo.lua using the pre-provided test runner.

              local test = require("test")        -- pre-provided, do NOT rewrite it
              local TodoStore = require("todo")

              Use unique relative file paths for test isolation (e.g. "test_add.json").
              Clean up with os.remove() after each test.
              Call test.summary() at the end.

              The TodoStore API (exact — do NOT invent fields or methods):
              - TodoStore.new(path)           -- constructor
              - store:add(title)             -- returns {id=number, title=string, done=false}
              - store:list(filter)           -- "all"/"active"/"done", returns table
              - store:done(id)               -- numeric id, returns true if found
              - store:delete(id)             -- numeric id, returns true if found
              - fields: id (number), title (string), done (boolean) — nothing else

              Tests to write:
              - test_add: add a todo, check todos[1].title, todos[1].done==false, type(todos[1].id)=="number"
              - test_done: add a todo, call store:done(todos[1].id), verify done==true
              - test_delete: add a todo, delete it, verify #store:list("all")==0
              - test_list_filter: add 2 todos, done one, verify #active==1, #done==1, #all==2
              - test_persistence: add a todo, create new store on same file, verify todo is still there
            resource_tags: ["test_todo.lua"]
            dependencies: ["todo-model"]
            acceptance_criteria:
              - "All 5 tests pass when run with lua test_todo.lua"
              - "Exit code 0 on success, 1 on failure"
