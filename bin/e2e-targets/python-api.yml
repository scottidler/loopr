goal: "Build a bookmarks REST API with FastAPI and SQLite. Endpoints: GET /health, GET /bookmarks, POST /bookmarks, GET /bookmarks/{id}, PUT /bookmarks/{id}, DELETE /bookmarks/{id}. Bookmark: id (int, auto), title (str), url (str), tags (str, comma-separated, default ''). Read database path from DATABASE_PATH env var, default 'data/bookmarks.db'. Pass: docker compose run --rm test."
plan:
  title: "Python Bookmarks API"
  description: "FastAPI + SQLite bookmarks REST API containerized with Docker, tested with pytest."
  spec:
    title: "Bookmarks API"
    description: "Database layer, REST routes, and pytest test suite"
    phases:
      - title: "Database layer"
        description: "SQLite CRUD module for bookmarks"
        validation-commands:
          - "docker compose build"
        works:
          - key: "database-layer"
            title: "Create database.py with SQLite CRUD"
            description: |
              Create database.py using Python's stdlib sqlite3 (no ORMs).

              get_db_path() -> str:
                Return os.environ.get("DATABASE_PATH", "data/bookmarks.db")

              init_db(db_path: str) -> None:
                Run CREATE TABLE IF NOT EXISTS bookmarks (
                  id    INTEGER PRIMARY KEY AUTOINCREMENT,
                  title TEXT NOT NULL,
                  url   TEXT NOT NULL,
                  tags  TEXT NOT NULL DEFAULT ''
                )

              get_connection(db_path: str) -> sqlite3.Connection:
                Create parent directory if needed (os.makedirs).
                Open connection, set row_factory = sqlite3.Row, call init_db, return connection.

              create_bookmark(db_path, title, url, tags="") -> dict:
                Insert a row, return full bookmark dict with id.

              list_bookmarks(db_path) -> list[dict]:
                Return all bookmarks as list of dicts.

              get_bookmark(db_path, bookmark_id: int) -> dict | None:
                Return bookmark dict or None if not found.

              update_bookmark(db_path, bookmark_id: int, title=None, url=None, tags=None) -> dict | None:
                Update only non-None fields. Return updated dict or None if not found.

              delete_bookmark(db_path, bookmark_id: int) -> bool:
                Delete bookmark. Return True if found and deleted, False otherwise.

              Row dicts must have keys: id, title, url, tags.
            resource_tags: ["database.py"]
            acceptance_criteria:
              - "docker compose build succeeds"
              - "create_bookmark returns dict with id, title, url, tags"
              - "list_bookmarks returns a list"
              - "get_bookmark returns None for non-existent id"
              - "delete_bookmark returns False for non-existent id"

      - title: "API routes"
        description: "FastAPI CRUD endpoints using the database layer"
        validation-commands:
          - "docker compose build"
        works:
          - key: "api-routes"
            title: "Implement CRUD endpoints in main.py"
            description: |
              Replace the stub main.py with a full FastAPI application.

              Imports:
                from fastapi import FastAPI, HTTPException
                from pydantic import BaseModel
                from typing import Optional
                import database

              Pydantic models:
                class BookmarkCreate(BaseModel):
                  title: str
                  url: str
                  tags: str = ""

                class BookmarkUpdate(BaseModel):
                  title: Optional[str] = None
                  url: Optional[str] = None
                  tags: Optional[str] = None

              app = FastAPI()

              GET /health -> {"status": "ok"}

              GET /bookmarks -> database.list_bookmarks(database.get_db_path())

              POST /bookmarks (body: BookmarkCreate) -> created bookmark, status 201

              GET /bookmarks/{bookmark_id} -> database.get_bookmark(...)
                Raise HTTPException(404) if None.

              PUT /bookmarks/{bookmark_id} (body: BookmarkUpdate) ->
                Pass only non-None fields to database.update_bookmark(...).
                Raise HTTPException(404) if None.

              DELETE /bookmarks/{bookmark_id} ->
                Raise HTTPException(404) if database.delete_bookmark returns False.
                Return {"deleted": bookmark_id}.
            resource_tags: ["main.py"]
            dependencies: ["database-layer"]
            acceptance_criteria:
              - "docker compose build succeeds"
              - "GET /health returns {\"status\": \"ok\"}"
              - "POST /bookmarks returns the created bookmark with an id"
              - "GET /bookmarks/{id} returns 404 for unknown id"

      - title: "Test suite"
        description: "pytest tests covering all CRUD endpoints"
        validation-commands:
          - "docker compose run --rm test"
        works:
          - key: "test-suite"
            title: "Create test_api.py with pytest tests"
            description: |
              Create test_api.py using FastAPI's TestClient.

              Imports:
                import os, pytest
                from fastapi.testclient import TestClient
                from main import app

              Fixture for test isolation:
                @pytest.fixture
                def client(tmp_path):
                    os.environ["DATABASE_PATH"] = str(tmp_path / "test.db")
                    yield TestClient(app)
                    os.environ.pop("DATABASE_PATH", None)

              Tests to implement (each takes `client` fixture):
              - test_health: GET /health returns {"status": "ok"}
              - test_create_bookmark: POST creates bookmark with correct id, title, url, tags
              - test_list_bookmarks_empty: GET /bookmarks on empty db returns []
              - test_list_bookmarks: POST two, GET /bookmarks returns both
              - test_get_bookmark: POST one, GET /bookmarks/{id} returns it
              - test_get_bookmark_not_found: GET /bookmarks/99999 returns 404
              - test_update_bookmark: POST one, PUT /bookmarks/{id} with new title
              - test_update_bookmark_not_found: PUT /bookmarks/99999 returns 404
              - test_delete_bookmark: POST one, DELETE /bookmarks/{id} succeeds
              - test_delete_bookmark_not_found: DELETE /bookmarks/99999 returns 404
            resource_tags: ["test_api.py"]
            dependencies: ["api-routes"]
            acceptance_criteria:
              - "All 10 tests pass"
              - "docker compose run --rm test exits 0"
              - "Tests use tmp_path fixture for isolation (no shared state between tests)"
