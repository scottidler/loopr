[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.7"
edition = "2024"
authors = ["Scott A. Idler <scott.a.idler@gmail.com>"]
repository = "ssh://git@github.com/scottidler/loopr"
license = "MIT"

[workspace.dependencies]
# Versions were discovered via `cargo add -p <crate> <dep>` on a consumer crate,
# then promoted here. Do not hand-edit versions; re-run `cargo add` when bumping.
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
eyre = "0.6.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tracing = "0.1.44"
# Reserved for Stage 4's post-fork daemon.
#
# Stage 2 deliberately uses blocking `LineWriter<File>` writers because
# `tracing-appender::non_blocking` spawns a worker thread per file, and POSIX
# `fork()` destroys all threads except the caller - initializing a non-blocking
# appender pre-fork would produce a daemon child writing into a dead channel.
#
# The appender stays declared here as a deliberate reservation: Stage 4 may
# add `telemetry::init_nonblocking(...)` post-fork in the daemon child if and
# only if measured log throughput justifies it. Do NOT remove as "unused" -
# see `docs/design/2026-04-19-telemetry-stage-2.md` Open Questions row on
# "Non-blocking writers post-fork in the daemon."
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# taskstore workspace (scottidler/taskstore): three-crate workspace with a
# single flat v* tag covering all three crates. v0.6.1 aligns all three at
# 0.6.1 and ships list_tolerant<T> on both Store and AsyncStore plus
# unified taskstore::Error across the workspace.
# - taskstore-traits: trait-only crate for pure-symbol layers (domain)
# - taskstore: blocking engine (taskstore-merge git driver, non-async consumers)
# - taskstore-async: async-native Store (store crate, daemon IPC handlers)
# All three MUST point at the same tag - split-brain creates incompatible
# Record traits across crate boundaries. Pin to a tag (not `branch = "main"`)
# so `cargo update` and `cargo install` cannot silently pull a newer commit
# with a breaking API change (see the v0.5.13 install regression that
# motivated the switch).
taskstore-traits = { git = "ssh://git@github.com/scottidler/taskstore", tag = "v0.6.1" }
taskstore        = { git = "ssh://git@github.com/scottidler/taskstore", tag = "v0.6.1" }
taskstore-async  = { git = "ssh://git@github.com/scottidler/taskstore", tag = "v0.6.1" }
