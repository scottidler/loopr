[package]
name = "loopr"
version = "0.1.131"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
build = "build.rs"
description = "A CLI application generated by rust-scaffold"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive"] }
colored = "3.1.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
eyre = "0.6.12"
futures = "0.3.32"
glob = "0.3.3"
libc = "0.2.182"
loopr-derive = { path = "loopr-derive" }
log = "0.4.29"
paste = "1.0.15"
rand = "0.10.0"
ratatui = "0.30.0"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
taskstore = { git = "https://github.com/scottidler/taskstore.git", version = "0.2.3" }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = { version = "0.1.44", features = ["max_level_debug", "release_max_level_info"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.4"
tracing-log = "0.2.0"
regex = "1.12.3"
keyby = { git = "https://github.com/scottidler/keyby.git", version = "0.1.0" }
# Dependencies will be added via cargo add

[dev-dependencies]
tokio = { version = "1.49.0", features = ["test-util"] }

[build-dependencies]
# For build.rs if needed
